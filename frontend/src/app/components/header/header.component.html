<header class="header">
  <div class="header-content flex-column-mobile">
    <a class="brand" routerLink="/">
      <img
        src="/images/logo/project-horizon-logo-flat.png"
        alt="Project Horizon logo"
      />
    </a>

    <nav class="nav flex-column-mobile" aria-label="Primary navigation">
      <a
        class="nav-link"
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Home
      </a>

      @if (currentUser()) {
        <a class="nav-link" routerLink="/projects" routerLinkActive="active">
          Projects
        </a>

        <a class="nav-link" routerLink="/sessions" routerLinkActive="active">
          Sessions
        </a>

        <a class="nav-link" routerLink="/profile" routerLinkActive="active">
          Profile
        </a>

        <button
          type="button"
          class="button-text button-primary"
          [disabled]="isLoggingOut()"
          (click)="logout()"
        >
          <fa-icon [icon]="faRightFromBracket"></fa-icon>
          {{ isLoggingOut() ? "Logging out…" : "Log out" }}
        </button>
      } @else {
        <a class="nav-link" routerLink="/login" routerLinkActive="active">
          Log in
        </a>

        <a class="nav-link" routerLink="/signup" routerLinkActive="active">
          Sign up
        </a>
      }
    </nav>
  </div>
</header>

@if (currentUser() && !currentUser()?.email_verified_at) {
  <div class="verification-banner">
    <span>
      Verify your email so you can recover your account if you forget your
      password.
    </span>

    <button
      type="button"
      class="button-text"
      [disabled]="isResendingVerification()"
      (click)="resendVerificationEmail()"
    >
      {{ isResendingVerification() ? "Sending…" : "Resend verification email" }}
    </button>

    @if (verificationMessage()) {
      <span role="status">{{ verificationMessage() }}</span>
    }
  </div>
}
