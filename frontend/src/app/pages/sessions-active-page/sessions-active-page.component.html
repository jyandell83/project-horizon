<app-active-session
  [session]="activeSession()"
  (sessionStart)="startSession($event)"
  (phaseStart)="startPhase($event)"
  (phaseEnd)="endPhase()"
  (sessionEnd)="endSession()"
  (projectAdded)="onProjectAdded($event)"
  (projectAttemptsChanged)="onProjectAttemptsChanged($event)"
  (projectSent)="onProjectSent($event)"
/>
