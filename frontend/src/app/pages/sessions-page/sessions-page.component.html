<section class="sessions-page page-container">
  <div class="page-header">
    <h1>Sessions</h1>

    <button
      routerLink="/sessions/active"
      class="button-primary"
      [class.session-action--active]="sessionsService.activeSession()"
    >
      @if (sessionsService.activeSession()) {
        Continue Active Session
      } @else {
        Start Session
      }
    </button>
  </div>

  <app-session-list></app-session-list>
</section>
