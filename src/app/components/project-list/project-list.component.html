@for (project of projects; track project.id) {
  <article class="project-card">
    <div class="project-card__header">
      <div>
        <h3>{{ project.name }}</h3>
        <p>{{ project.location }}</p>
      </div>

      <span class="project-card__grade">{{ project.grade }}</span>
    </div>
    @for (note of project.notes; track note.id) {
      <p class="project-card__notes">{{ note.body }}</p>
    }

    <div class="project-card__meta">
      <span>{{ project.attempts }} attempts</span>
      <span>{{ project.status }}</span>
    </div>
    <button class="button-secondary" (click)="deleteProject(project.id)">
      Delete Project
    </button>
    <button
      class="button-secondary"
      [routerLink]="['/projects', project.id, 'edit']"
    >
      Edit
    </button>
  </article>
}
